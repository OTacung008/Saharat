/* ---------------- helpers ---------------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ss = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const easeOutBack = (t) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * (t - 1) ** 3 + c1 * (t - 1) ** 2; };
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const lerpV = (a, b, t) => a.clone().lerp(b, t);
function rng(seed) { return () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function makeNoise(seed) {
  const R = rng(seed), grids = {};
  const grid = (n) => grids[n] || (grids[n] = Float32Array.from({ length: n * n }, R));
  const vn = (u, v, n) => {
    const g = grid(n), x = u * n, y = v * n, xi = Math.floor(x), yi = Math.floor(y);
    let xf = x - xi, yf = y - yi; xf = xf * xf * (3 - 2 * xf); yf = yf * yf * (3 - 2 * yf);
    const i0 = ((xi % n) + n) % n, j0 = ((yi % n) + n) % n, i1 = (i0 + 1) % n, j1 = (j0 + 1) % n;
    return lerp(lerp(g[j0 * n + i0], g[j0 * n + i1], xf), lerp(g[j1 * n + i0], g[j1 * n + i1], xf), yf);
  };
  return (u, v, base = 4, oct = 5) => { let s = 0, amp = .5, n = base, tot = 0; for (let o = 0; o < oct; o++) { s += vn(u, v, n) * amp; tot += amp; amp *= .5; n *= 2; } return s / tot; };
}
function canvasTex(w, h, painter, srgb = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  painter(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8; return t;
}
function pixelTex(size, fn, srgb = true) {
  return canvasTex(size, size, (ctx, w, h) => {
    const img = ctx.createImageData(w, h), d = img.data;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { const i = (y * w + x) * 4; const [r, g, b] = fn(x / w, y / h); d[i] = r; d[i + 1] = g; d[i + 2] = b; d[i + 3] = 255; }
    ctx.putImageData(img, 0, 0);
  }, srgb);
}
const gradTex = (stops) => canvasTex(4, 512, (ctx, w, h) => { const g = ctx.createLinearGradient(0, 0, 0, h); stops.forEach(([o, c]) => g.addColorStop(o, c)); ctx.fillStyle = g; ctx.fillRect(0, 0, w, h); });

/* ---------------- renderer ---------------- */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: RENDER });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const camera = new THREE.PerspectiveCamera(30, 9 / 16, 0.01, 100);
const envTex = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const nz = makeNoise(7);

/* ---------------- textures ---------------- */
const skinBump = pixelTex(256, (u, v) => { const k = nz(u, v, 64, 3) * 255; return [k, k, k]; }, false);
skinBump.repeat.set(4, 4);
const hairTex = canvasTex(256, 256, (ctx, w, h) => {
  ctx.fillStyle = '#7a4f27'; ctx.fillRect(0, 0, w, h); const R = rng(4);
  for (let i = 0; i < 900; i++) { const x = R() * w; ctx.strokeStyle = R() < .5 ? 'rgba(170,120,70,.5)' : 'rgba(60,35,15,.5)'; ctx.lineWidth = 1 + R() * 1.5; ctx.beginPath(); ctx.moveTo(x, 0); ctx.bezierCurveTo(x + 8, h * .3, x - 8, h * .6, x + (R() - .5) * 20, h); ctx.stroke(); }
});
const irisTex = canvasTex(128, 128, (ctx, w) => {
  const c = w / 2, g = ctx.createRadialGradient(c, c, 4, c, c, c);
  g.addColorStop(0, '#0d1a26'); g.addColorStop(.32, '#0d1a26'); g.addColorStop(.36, '#3d7bb0'); g.addColorStop(.75, '#6aa4d4'); g.addColorStop(.93, '#24496b'); g.addColorStop(1, 'rgba(30,50,70,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(c, c, c, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(200,230,255,.25)'; for (let a = 0; a < 6.28; a += .2) { ctx.beginPath(); ctx.moveTo(c + Math.cos(a) * 22, c + Math.sin(a) * 22); ctx.lineTo(c + Math.cos(a) * 52, c + Math.sin(a) * 52); ctx.stroke(); }
});

/* ---------------- brand logo ("Pla Remix" on cap + shirt) ---------------- */
const logoJobs = [];
function logoTex(w, h, draw) { const t = canvasTex(w, h, draw); t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping; logoJobs.push(() => { const c = t.image, ctx = c.getContext('2d'); ctx.clearRect(0, 0, c.width, c.height); draw(ctx, c.width, c.height); t.needsUpdate = true; }); return t; }
const capLogo = logoTex(512, 256, (ctx, w, h) => {
  ctx.clearRect(0, 0, w, h); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '900 92px Montserrat, Arial Black'; ctx.lineWidth = 10; ctx.strokeStyle = '#0e1626'; ctx.fillStyle = '#f2efe6';
  ctx.strokeText('PLA', w / 2, h * .32); ctx.fillText('PLA', w / 2, h * .32);
  ctx.font = '900 70px Montserrat, Arial Black'; ctx.fillStyle = '#ffc61a'; ctx.strokeText('REMIX', w / 2, h * .72); ctx.fillText('REMIX', w / 2, h * .72);
  ctx.globalCompositeOperation = 'destination-out'; ctx.strokeStyle = 'rgba(0,0,0,.18)'; ctx.lineWidth = 1.5;
  for (let y = 0; y < h; y += 5) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y + 3); ctx.stroke(); } // stitched look
  ctx.globalCompositeOperation = 'source-over';
});
const shirtLogo = logoTex(512, 160, (ctx, w, h) => {
  ctx.clearRect(0, 0, w, h); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(255,240,225,.92)'; ctx.font = '900 84px Montserrat, Arial Black'; ctx.fillText('PLA REMIX', w / 2, h * .46);
  ctx.fillRect(w * .12, h * .82, w * .76, 7);
  ctx.globalCompositeOperation = 'destination-out'; const R = rng(12); // worn screen-print
  for (let i = 0; i < 900; i++) { ctx.fillStyle = `rgba(0,0,0,${.2 + R() * .5})`; ctx.fillRect(R() * w, R() * h, 2 + R() * 3, 2 + R() * 3); }
  ctx.globalCompositeOperation = 'source-over';
});
const decalMat = (map, rough = .8) => new THREE.MeshStandardMaterial({ map, transparent: true, roughness: rough, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -4 });
function addDecal(target, parent, pos, rot, size, mat) {
  target.updateWorldMatrix(true, false); parent.updateWorldMatrix(true, false);
  const g = new DecalGeometry(target, pos, new THREE.Euler(...rot), size);
  g.applyMatrix4(parent.matrixWorld.clone().invert());
  const m = new THREE.Mesh(g, mat); m.userData.decal = true; m.renderOrder = 2; parent.add(m); return m;
}

/* ---------------- materials ---------------- */
const M = {
  skin: new THREE.MeshPhysicalMaterial({ color: 0xe3a882, roughness: .5, bumpMap: skinBump, bumpScale: .15, sheen: .5, sheenColor: new THREE.Color(0xffb59a), sheenRoughness: .5, clearcoat: .06 }),

  cap: new THREE.MeshPhysicalMaterial({ color: 0x1b2740, roughness: .85, sheen: .8, sheenColor: new THREE.Color(0x6f86b0), sheenRoughness: .5, bumpMap: skinBump, bumpScale: .5 }),

};

/* ================= the boy ================= */
function makeHuman() {
  const root = new THREE.Group(), head = new THREE.Group(), all = [];
  const add = (parent, mesh) => { mesh.castShadow = true; mesh.receiveShadow = true; parent.add(mesh); all.push(mesh); return mesh; };
  head.position.set(0, 1.62, 0); root.add(head);

  // skull with tapered jaw
  const hg = new THREE.SphereGeometry(.1, 96, 72), p = hg.attributes.position;
  for (let i = 0; i < p.count; i++) {
    let x = p.getX(i), y = p.getY(i) * 1.2, z = p.getZ(i);
    const t = y < 0 ? -y / .12 : 0;
    x *= 1 - .3 * t * t; z *= (z > 0 ? .95 : 1.06) * (1 - .1 * t * t);
    if (z > 0 && y < -.07) z += .012 * ss(.07, .115, -y) * (1 - Math.abs(x) / .05);   // chin
    if (z > 0 && y > -.02 && y < .03) z -= .006 * Math.exp(-((Math.abs(x) - .034) ** 2) / .0002); // eye sockets
    if (y > .05) { x *= 1.02; }
    p.setXYZ(i, x, y, z);
  }
  hg.computeVertexNormals();
  add(head, new THREE.Mesh(hg, M.skin));

  // ears
  for (const s of [-1, 1]) { const e = add(head, new THREE.Mesh(new THREE.SphereGeometry(.024, 24, 16), M.skin)); e.scale.set(.45, 1.05, .8); e.position.set(s * .097, -.005, -.008); e.rotation.y = s * .3; }

  // eyes
  const eyes = [], lids = [];
  for (const s of [-1, 1]) {
    const eg = new THREE.Group(); eg.position.set(s * .035, .012, .072); head.add(eg);
    const ball = add(eg, new THREE.Mesh(new THREE.SphereGeometry(.0145, 32, 24), M.sclera));
    const ig = new THREE.SphereGeometry(.0146, 32, 16, 0, Math.PI * 2, 0, .62); ig.rotateX(Math.PI / 2);
    const iuv = ig.attributes.uv, ipos = ig.attributes.position; for (let i = 0; i < ipos.count; i++) iuv.setXY(i, .5 + ipos.getX(i) / .0172, .5 + ipos.getY(i) / .0172);
    const iris = new THREE.Mesh(ig, M.iris); eg.add(iris);
    eyes.push(eg);
    const up = add(head, new THREE.Mesh(new THREE.SphereGeometry(.0156, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2), M.skin));
    up.position.copy(eg.position); const lo = add(head, new THREE.Mesh(new THREE.SphereGeometry(.0154, 32, 16, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2), M.skin));
    lo.position.copy(eg.position); lids.push({ up, lo });
  }
  // brows
  const brows = [];
  for (const s of [-1, 1]) {
    const b = new THREE.Group(); b.position.set(s * .035, .036, .088); head.add(b);
    const cg = new THREE.CapsuleGeometry(.0042, .026, 4, 8); cg.rotateZ(Math.PI / 2);
    const m = add(b, new THREE.Mesh(cg, M.brow)); m.scale.set(1, .8, .6); m.rotation.z = -s * .08;
    brows.push({ g: b, s });
  }
  // nose
  { const br = new THREE.CapsuleGeometry(.0065, .026, 4, 12); const m = add(head, new THREE.Mesh(br, M.skin)); m.position.set(0, -.01, .089); m.rotation.x = .42; m.scale.set(1, 1, .8);
    const tip = add(head, new THREE.Mesh(new THREE.SphereGeometry(.0125, 24, 16), M.skin)); tip.position.set(0, -.029, .1); tip.scale.set(.85, .8, .8);
    for (const s of [-1, 1]) { const w = add(head, new THREE.Mesh(new THREE.SphereGeometry(.0085, 16, 12), M.skin)); w.position.set(s * .0105, -.032, .089); w.scale.setScalar(.7); } }

  // mouth (rebuilt every frame from open/smile)
  const mouth = new THREE.Group(); mouth.position.set(0, -.062, .081); head.add(mouth);
  const inner = new THREE.Mesh(new THREE.BufferGeometry(), M.mouth), upL = new THREE.Mesh(new THREE.BufferGeometry(), M.lip), loL = new THREE.Mesh(new THREE.BufferGeometry(), M.lip);
  const teeth = new THREE.Mesh(new THREE.BoxGeometry(.03, .0065, .006), M.teeth);
  mouth.add(inner, upL, loL, teeth);
  function setMouth(open, smile) {
    const W = .027 + .004 * smile, cy = .006 * smile, N = 18;
    const curve = (ctrl) => Array.from({ length: N + 1 }, (_, i) => { const u = i / N, x = lerp(-W, W, u), y = (1 - u) * (1 - u) * cy + 2 * u * (1 - u) * ctrl + u * u * cy; return V(x, y, -x * x * 6); });
    const top = curve(.003 + .002 * open - .002 * smile), bot = curve(-.003 - .03 * open - .006 * smile * (open > .05 ? 1 : 0));
    const sh = new THREE.Shape(); top.forEach((q, i) => i ? sh.lineTo(q.x, q.y) : sh.moveTo(q.x, q.y)); [...bot].reverse().forEach((q) => sh.lineTo(q.x, q.y));
    const ig = new THREE.ShapeGeometry(sh); const ip = ig.attributes.position; for (let i = 0; i < ip.count; i++) ip.setZ(i, -(ip.getX(i) ** 2) * 6 - .002);
    for (const m of [inner, upL, loL]) m.geometry.dispose();
    inner.geometry = ig;
    upL.geometry = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(top), 24, .0033, 8);
    loL.geometry = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(bot), 24, .0043, 8);
    teeth.visible = open > .04; teeth.position.set(0, top[N / 2].y - .004, -.003); teeth.scale.x = .8 + .3 * smile;
  }

  // hair: two smooth caps hugging the skull + side-swept fringe
  { const cap = (r, th, sy, rx, y, z) => { const m = add(head, new THREE.Mesh(new THREE.SphereGeometry(r, 64, 40, 0, Math.PI * 2, 0, th), M.hair)); m.scale.set(1, sy, 1); m.rotation.x = rx; m.position.set(0, y, z); return m; };
    cap(.107, 1.85, 1.16, -.8, .002, -.012);
  }
  // neck, torso
  const neck = add(root, new THREE.Mesh(new THREE.CylinderGeometry(.048, .055, .16, 32), M.skin)); neck.position.set(0, 1.49, -.01);
  const adam = add(root, new THREE.Mesh(new THREE.SphereGeometry(.012, 16, 12), M.skin)); adam.scale.set(1, 1.3, .8); adam.position.set(0, 1.5, .036);
  const torso = add(root, new THREE.Mesh(new THREE.CapsuleGeometry(.16, .34, 12, 48), M.shirt)); torso.scale.set(1.18, 1, .62); torso.position.set(0, 1.17, 0);
  for (const s of [-1, 1]) {
    const sh = add(root, new THREE.Mesh(new THREE.SphereGeometry(.08, 32, 24), M.shirt)); sh.position.set(s * .18, 1.395, -.005); sh.scale.set(1.1, .85, .9);
    const arm = add(root, new THREE.Mesh(new THREE.CapsuleGeometry(.05, .4, 8, 24), M.shirt)); arm.position.set(s * .245, 1.16, -.01); arm.rotation.z = s * .06;
  }
  const collar = add(root, new THREE.Mesh(new THREE.TorusGeometry(.056, .011, 12, 48), M.shirt)); collar.rotation.x = Math.PI / 2 - .25; collar.position.set(0, 1.432, .0);

  // baseball cap with stitched "PLA REMIX"
  const crown = add(head, new THREE.Mesh(new THREE.SphereGeometry(.116, 64, 32, 0, Math.PI * 2, 0, Math.PI / 2), M.cap));
  crown.scale.set(1.0, .86, 1.04); crown.position.set(0, .056, -.006); crown.rotation.x = -.1;
  const band = add(head, new THREE.Mesh(new THREE.CylinderGeometry(.117, .118, .012, 64, 1, true), M.cap)); band.scale.set(1, 1, 1.04); band.position.set(0, .054, -.006); band.rotation.x = -.1;
  const brimG = new THREE.CylinderGeometry(.095, .095, .006, 48, 1, false, -Math.PI / 2, Math.PI); brimG.scale(1.05, 1, 1.1);
  const brim = add(head, new THREE.Mesh(brimG, M.cap)); brim.position.set(0, .058, .07); brim.rotation.x = .16;
  const button = add(head, new THREE.Mesh(new THREE.SphereGeometry(.009, 12, 8), M.cap)); button.position.set(0, .156, -.018);
  root.updateMatrixWorld(true);
  addDecal(crown, head, head.localToWorld(V(0, .104, .104)), [-.5, 0, 0], V(.105, .052, .08), decalMat(capLogo, .7));
  addDecal(torso, root, V(.068, 1.36, .1), [0, .25, 0], V(.075, .024, .06), decalMat(shirtLogo, .9));

  return { root, head, eyes, lids, brows, setMouth, adam, all, mouth };
}
function setFace(h, f) {
  // f: { open, smile, lid (0 closed..1 open..1.4 wide), brow (0..1), look:{x,y} }
  h.setMouth(f.open, f.smile);
  for (const { up, lo } of h.lids) { up.rotation.x = lerp(1.25, -.5, clamp(f.lid, 0, 1)) - .35 * Math.max(0, f.lid - 1); lo.rotation.x = lerp(.15, .62, clamp(f.lid, 0, 1)) + .15 * Math.max(0, f.lid - 1) - .25 * f.smile; }
  for (const e of h.eyes) e.rotation.set(-f.look.y, f.look.x, 0);
  for (const b of h.brows) { b.g.position.y = .036 + .008 * f.brow - .002 * f.smile; b.g.rotation.z = b.s * .12 * f.brow; }
}

/* ================= SCENE A : park ================= */
const sceneA = new THREE.Scene();
sceneA.environment = envTex; sceneA.environmentIntensity = .5;

/* ================= captions ================= */
const wordEl = document.getElementById('word');
let wIdx = -2;
function updateWord(t) {
  let i = -1;
  for (let k = 0; k < WORDS.length; k++) if (t >= WORDS[k].t) i = k;
  if (i >= 0) { const next = WORDS[i + 1]; const end = next && next.t - WORDS[i].t < .9 ? next.t : WORDS[i].t + .75; if (t >= end) i = -1; }
  if (i !== wIdx) { wIdx = i; wordEl.textContent = i >= 0 ? WORDS[i].w : ''; wordEl.classList.toggle('hl', i >= 0 && HL.has(WORDS[i].w)); }
  if (i >= 0) { const a = clamp((t - WORDS[i].t) / .14); wordEl.style.transform = `scale(${.6 + .4 * easeOutBack(a)})`; }
}

/* ================= timeline ================= */
const CUTS = [0, 3.45, 7.3, 11.7, 16.8];
const shake = (t, a) => V(Math.sin(t * 1.3) + .5 * Math.sin(t * 3.1 + 1), Math.sin(t * 1.7 + 2) + .5 * Math.sin(t * 2.7), Math.sin(t * 1.1 + 4)).multiplyScalar(a);
function setCam(pos, look, fov, t, cutT, amt) {
  const punch = 1 + .07 * (1 - ss(0, .35, t - cutT));
  camera.position.copy(pos).add(shake(t, amt)); camera.lookAt(look);
  camera.fov = fov * punch; camera.updateProjectionMatrix();
}
const blink = (t, times) => times.reduce((m, b) => Math.min(m, 1 - (ss(b - .07, b, t) - ss(b, b + .1, t))), 1);

function update(t) {
  const shot = t < CUTS[1] ? 1 : t < CUTS[2] ? 2 : t < CUTS[3] ? 3 : t < CUTS[4] ? 4 : 5;
  const cutT = CUTS[shot - 1];

  /* ---- the boy ---- */
  if (shot === 1 || shot === 5) {
    let f;
    if (shot === 1) {
      const chew = t < 2.05 ? Math.max(0, Math.sin(t * 2 * Math.PI * 2.2)) : 0;
      const gulp = ss(2.05, 2.3, t) - ss(2.55, 2.8, t);
      const shock = ss(2.55, 2.8, t);
      f = { open: .22 * chew + .08 * shock, smile: lerp(.25, -.35, shock), lid: blink(t, [.9]) + .35 * shock, brow: shock * .9 + .1, look: { x: lerp(.05, 0, shock) + .03 * Math.sin(t * .8), y: lerp(-.03, -.12, shock) } };
      boy.adam.position.y = 1.5 - .022 * gulp;
      boy.head.rotation.set(-.06 * gulp + .03 * Math.sin(t * 1.1), .1 * Math.sin(t * .7) * (1 - shock), .02 * Math.sin(t * .9));
    } else {
      const relief = ss(16.9, 17.5, t), laugh = ss(18.1, 18.4, t);
      f = { open: .05 + .14 * laugh + .05 * Math.max(0, Math.sin(t * 9)) * laugh, smile: lerp(-.2, 1, relief), lid: lerp(1.2, .82, relief) * blink(t, [17.7, 19.3]), brow: lerp(.8, .15, relief), look: { x: -.02, y: -.02 } };
      boy.adam.position.y = 1.5;
      boy.head.rotation.set(.04 * Math.sin(t * 1.4), -.12 * Math.sin((t - 16.8) * 1.2) * laugh, .06 * laugh * Math.sin(t * 2));
    }
    setFace(boy, f);
  }

  /* ---- x-ray ---- */
  if (shot === 2 || shot === 4) {
    let gp;
    if (shot === 2) gp = ESO.getPointAt(ss(3.6, 6.9, t) ** 1.2);
    else gp = GUT.getPointAt(clamp((t - 11.8) / 4.8) ** 1.1);
    const wob = 1 + .08 * Math.sin(t * 14);
    gumB.position.copy(gp); gumB.scale.set(.012 * wob, .012 / wob, .012 * wob); gumB.rotation.set(t * 2, t * 1.3, 0);
    gumGlow.position.copy(gp).add(V(0, 0, .03));
    ghost.head.rotation.set(0, 0, 0);
  }

  /* ---- stomach interior ---- */
  if (shot === 3) {
    const pa = acidGeo.attributes.position;
    for (let i = 0; i < pa.count; i++) { const x = acidBase[i * 3], z = acidBase[i * 3 + 2]; pa.setY(i, .04 * Math.sin(x * 2.1 + t * 2.4) + .03 * Math.sin(z * 2.7 - t * 1.9) + .015 * Math.sin((x + z) * 6 + t * 4)); }
    pa.needsUpdate = true; acidGeo.computeVertexNormals();
    const surf = (x, z) => -1 + .04 * Math.sin(x * 2.1 + t * 2.4) + .03 * Math.sin(z * 2.7 - t * 1.9);
    gumC.position.set(.25, surf(.25, 0) + .12 + .03 * Math.sin(t * 2), 0); gumC.rotation.set(.3 * Math.sin(t * .8), t * .4, .2 * Math.sin(t * 1.1));
    for (const b of bubbles) { const d = b.userData, ph = ((t * d.sp + d.ph) % 1); b.position.set(d.x, surf(d.x, d.z) + ph * .05, d.z); b.scale.setScalar(d.s * Math.sin(ph * Math.PI) * (ph < .92 ? 1 : 0)); }
    const dis = ss(7.6, 11.2, t);
    for (const m of foods) { const d = m.userData; const s = d.s * (1 - .85 * dis); m.scale.setScalar(s); m.position.set(d.x, surf(d.x, d.z) + s * .3, d.z); m.rotation.set(t * .2 + d.r, d.r, t * .15); m.material.opacity = 1 - .8 * dis; }
  }

  /* ---- cameras ---- */
  if (shot === 1) {
    const u = ss(0, 3.45, t);
    setCam(lerpV(V(.08, 1.6, 1.05), V(.03, 1.57, .78), u), V(0, 1.565, 0), 30, t, cutT, .004);
  } else if (shot === 2) {
    const u = ss(3.45, 7.3, t), g = gumB.position;
    const look = lerpV(V(0, 1.45, 0), V(.04, 1.1, .02), ss(3.6, 7.0, t)).lerp(g, .3);
    setCam(lerpV(V(.32, 1.52, .9), V(.3, 1.14, .75), u), look, 34, t, cutT, .006);
  } else if (shot === 3) {
    const u = ss(7.3, 11.7, t);
    setCam(lerpV(V(-.4, .1, 3.0), V(.45, -.45, 1.55), u), lerpV(V(0, -.7, 0), V(.25, -.85, 0), u), 42, t, cutT, .02);
  } else if (shot === 4) {
    const g = gumB.position, u = ss(11.7, 16.8, t);
    setCam(g.clone().add(V(.12, .05, lerp(.55, .42, u))), g.clone().lerp(V(0, .9, .04), .45), 36, t, cutT, .004);
  } else {
    const u = ss(16.8, 20, t);
    setCam(lerpV(V(-.06, 1.57, 1.0), V(-.02, 1.56, .86), u), V(0, 1.54, 0), 30, t, cutT, .004);
  }

  updateWord(t);
  renderer.render(shot === 3 ? sceneC : shot === 2 || shot === 4 ? sceneB : sceneA, camera);
}

/* ================= sizing / loop ================= */
const stage = document.getElementById('stage');
function resize() { const w = stage.clientWidth, h = stage.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); buildParkBg(); }
new ResizeObserver(resize).observe(stage); resize();

window.renderAt = (t) => update(t);
window.ready = document.fonts.load('900 64px Montserrat').catch(() => {}).then(() => document.fonts.ready).then(() => { logoJobs.forEach((j) => j()); buildParkBg(); update(0); return true; });

if (!RENDER) {
  const bar = document.getElementById('bar'), hint = document.getElementById('hint'), vo = document.getElementById('vo');
  let playing = true, t0 = performance.now(), tp = 0, started = false;
  stage.addEventListener('click', () => {
    if (!started) { started = true; t0 = performance.now(); vo.currentTime = 0; vo.play().catch(() => {}); hint.style.opacity = 0; return; }
    playing = !playing; if (playing) { t0 = performance.now() - tp * 1000; vo.currentTime = tp; vo.play().catch(() => {}); } else vo.pause();
    hint.style.opacity = playing ? 0 : 1;
  });
  renderer.setAnimationLoop(() => {
    if (!playing) return;
    tp = (performance.now() - t0) / 1000;
    if (tp > DUR + .8) { t0 = performance.now(); tp = 0; if (started) { vo.currentTime = 0; vo.play().catch(() => {}); } }
    const t = Math.min(tp, DUR - .001);
    bar.style.width = (t / DUR * 100) + '%';
    update(t);
  });
}
